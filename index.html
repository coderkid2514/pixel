<!DOCTYPE html>
<html lang="en">
<head>

  <title>Pixel Containment Protocol</title>

  font-family: 'PressStart2P';
  src: url("{{ url_for('static', filename='fonts/PressStart2P-Regular.ttf') }}") format('truetype');
  font-display: block;
}
:root {
  --bg-primary: #121214;
  --bg-panel: #1a1a1e;
  --bg-btn: #2a2a32;
  --bg-btn-active: #3498db;
  --text-main: #e0e0e6;
  --border-color: #3e3e4a;
}
body {
  margin: 0;
  padding: 20px;
  background-color: var(--bg-primary);
  color: var(--text-main);
  font-family: 'PressStart2P', -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  box-sizing: border-box;
  overflow-y: auto;
}
.led-text-generator,
.led-text-generator *,
.slider-group label span:first-child {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}
    h1 {
      margin: 0 0 15px 0;
      font-size: 1.8rem;
      letter-spacing: 0.5px;
    }
    .main-container {
      display: flex;
      flex-direction: row;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
      align-items: flex-start;
    }
    @media (max-width: 800px) {
      .main-container {
        flex-direction: column;
        align-items: center;
      }
    }
    .canvas-container {
      background-color: var(--bg-panel);
      padding: 10px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      background-color: #000;
      width: 450px;
      height: 450px;
      image-rendering: pixelated;
      cursor: crosshair;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    .control-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-panel);
      padding: 20px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      height: auto;
      min-height: 450px;
      box-sizing: border-box;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .stats-row {
      font-family: monospace;
      background: #000;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--bg-btn-active);
    }
    .sys-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .led-text-generator {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #111113;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .led-text-generator input[type="text"] {
      background: #000;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    .led-text-generator select {
      background: var(--bg-btn);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px;
      border-radius: 4px;
      cursor: pointer;
    }
    .element-ui-wrapper {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      background-color: #111113;
      padding: 8px;
      border-radius: 4px;
    }
    .element-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
    }
    .btn {
      background-color: var(--bg-btn);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s ease, transform 0.05s ease;
      user-select: none;
    }
    .btn:hover {
      background-color: #3a3a46;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn.active {
      background-color: var(--bg-btn-active);
      border-color: #5dade2;
      font-weight: bold;
      color: #fff;
    }
    .color-preview {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
  </style>
</head>

function makeMaxDistortionCurve() {
  const n_samples = 44100;
  const curve = new Float32Array(n_samples);
  for (let i = 0; i < n_samples; ++i) {
    const x = (i * 2) / n_samples - 1;
    curve[i] = x < 0 ? Math.max(-1, x * 15) : Math.min(1, x * 15);
  }
  return curve;
}
const maxDistortionCurve = makeMaxDistortionCurve();
function generateNoiseBuffer(type, duration) {
  const bufferSize = audioCtx.sampleRate * duration;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  let lastOut = 0.0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    if (type === 'brown') {
      data[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = data[i];
      data[i] *= 4.0;
    } else {
      data[i] = white;
    }
  }
  return buffer;
}
function playEarthShatteringBlast(volume, duration, subPitch, lowpassCutoff, isNuke = false) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  const layers = isNuke ? 4 : 1;
  const masterVolumeMultiplier = isNuke ? 12.0 : 2.5;
  for (let l = 0; l < layers; l++) {
    const masterAmp = audioCtx.createGain();
    masterAmp.gain.setValueAtTime(volume * masterVolumeMultiplier, now);
    masterAmp.connect(audioCtx.destination);
    const rumble = audioCtx.createBufferSource();
    rumble.buffer = generateNoiseBuffer('brown', duration);
    const rumbleFilter = audioCtx.createBiquadFilter();
    rumbleFilter.type = 'lowpass';
    rumbleFilter.frequency.setValueAtTime(lowpassCutoff, now);
    rumbleFilter.frequency.linearRampToValueAtTime(15, now + duration);
    const rumbleGain = audioCtx.createGain();
    rumbleGain.gain.setValueAtTime(2.0, now);
    rumbleGain.gain.linearRampToValueAtTime(1.5, now + duration * 0.5);
    rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    rumble.connect(rumbleFilter);
    rumbleFilter.connect(rumbleGain);
    rumbleGain.connect(masterAmp);
    const blast = audioCtx.createBufferSource();
    blast.buffer = generateNoiseBuffer('white', duration * 0.7);
    const blastFilter = audioCtx.createBiquadFilter();
    blastFilter.type = 'lowpass';
    blastFilter.frequency.setValueAtTime(lowpassCutoff * (isNuke ? 1.5 : 2), now);
    const clipper = audioCtx.createWaveShaper();
    clipper.curve = maxDistortionCurve;
    const blastGain = audioCtx.createGain();
    blastGain.gain.setValueAtTime(1.5, now);
    blastGain.gain.exponentialRampToValueAtTime(0.001, now + duration * 0.7);
    blast.connect(blastFilter);
    blastFilter.connect(clipper);
    clipper.connect(blastGain);
    blastGain.connect(masterAmp);
    const crack = audioCtx.createBufferSource();
    crack.buffer = generateNoiseBuffer('white', isNuke ? 0.4 : 0.2);
    const crackFilter = audioCtx.createBiquadFilter();
    crackFilter.type = 'bandpass';
    crackFilter.frequency.setValueAtTime(isNuke ? 120 : 250, now);
    crackFilter.Q.setValueAtTime(3, now);
    const crackGain = audioCtx.createGain();
    crackGain.gain.setValueAtTime(3.0, now);
    crackGain.gain.exponentialRampToValueAtTime(0.001, now + (isNuke ? 0.38 : 0.18));
    crack.connect(crackFilter);
    crackFilter.connect(crackGain);
    crackGain.connect(masterAmp);
    rumble.start(now);
    blast.start(now);
    crack.start(now);

async function packAllGridsToBase64() {
  const hasNext = (typeof next !== 'undefined');
  const nextLength = hasNext ? next.length : 0;
  const totalLength = grid.length + nextLength + vx.length + vy.length + flags.length + life.length + armed.length;
  const masterBuffer = new Uint8Array(totalLength);
  let offset = 0;
  masterBuffer.set(grid, offset);  offset += grid.length;
  if (hasNext) {
    masterBuffer.set(next, offset);
    offset += next.length;
  }
  masterBuffer.set(vx, offset);    offset += vx.length;
  masterBuffer.set(vy, offset);    offset += vy.length;
  masterBuffer.set(flags, offset); offset += flags.length;
  masterBuffer.set(life, offset);  offset += life.length;

async function unpackBase64ToGrids(base64String) {

    const parts = base64String.split('|');

    const humansBase64 = parts[1];

    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    const blob = new Blob([bytes]);
    const decompressionStream = blob.stream().pipeThrough(new DecompressionStream('deflate'));
    const decompressedBuffer = await new Response(decompressionStream).arrayBuffer();
    const masterBuffer = new Uint8Array(decompressedBuffer);
    let offset = 0;
    grid.set(masterBuffer.subarray(offset, offset + grid.length));   offset += grid.length;
    if (typeof next !== 'undefined') {
      next.set(masterBuffer.subarray(offset, offset + next.length));
      offset += next.length;
    }
    vx.set(masterBuffer.subarray(offset, offset + vx.length));       offset += vx.length;
    vy.set(masterBuffer.subarray(offset, offset + vy.length));       offset += vy.length;
    flags.set(masterBuffer.subarray(offset, offset + flags.length)); offset += flags.length;
    life.set(masterBuffer.subarray(offset, offset + life.length));   offset += life.length;
    armed.set(masterBuffer.subarray(offset, offset + armed.length));
    lightningBolts = [];
    if (humansBase64) {
      try {
        humansList = JSON.parse(atob(humansBase64));
      } catch (e) {
        console.error("Failed to parse humans string data, resetting.", e);
        humansList = [];
      }
    } else {
      humansList = [];
    }
    if (typeof next !== 'undefined') next.set(grid);
    return true;
  } catch (err) {
    console.error("Restoration broken:", err);
    return false;
  }
}

  if (typeof lastLaserX !== "undefined") { lastLaserX = -1; lastLaserY = -1; }
  if (typeof stopLaserSound === "function") stopLaserSound();
});
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const t = e.touches[0];
    const fakePointerEvent = { button: 0, clientX: t.clientX, clientY: t.clientY };
    canvas.dispatchEvent(new PointerEvent("pointerdown", fakePointerEvent));
  }
}, { passive: false });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (e.touches.length > 0) {
    const t = e.touches[0];
    const fakePointerEvent = { clientX: t.clientX, clientY: t.clientY };
    window.dispatchEvent(new PointerEvent("pointermove", fakePointerEvent));
  }
}, { passive: false });
window.addEventListener("touchend", e => {
  if (e.touches.length === 0) {
    window.dispatchEvent(new PointerEvent("pointerup"));
  }
});
brushSizeInput.addEventListener("input", e => {
  brushSize = parseInt(e.target.value);
  if(brushValDisplay) brushValDisplay.textContent = brushSize;
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.deltaY < 0) {
    brushSize = Math.min(25, brushSize + 1);
  } else {
    brushSize = Math.max(1, brushSize - 1);
  }
  if(brushSizeInput) brushSizeInput.value = brushSize;
  if(brushValDisplay) brushValDisplay.textContent = brushSize;
}, { passive: false });
if (speedInput) {
  speedInput.addEventListener("input", e => {
    timeScale = parseFloat(e.target.value);
    if(speedValDisplay) speedValDisplay.textContent = timeScale.toFixed(2) + "x";
  });
}
if (btnPause) {
  btnPause.onclick = () => {
    isPaused = !isPaused;
    btnPause.textContent = isPaused ? "Resume" : "Pause";
    btnPause.classList.toggle("active", isPaused);
  };
}
if (btnClear) {
  btnClear.onclick = () => {
    grid.fill(EMPTY);
    next.fill(EMPTY);
    vx.fill(0);
    vy.fill(0);
    flags.fill(0);
    life.fill(0);
    armed.fill(0);
    humansList = [];
    lightningBolts = [];
  };
}
if (uiGrid) {
  ELEMENT_DEFS.forEach(el => {
    if (!el.showInUI) return;
    const button = document.createElement("button");
    button.id = `elem-${el.id}`;
    button.className = "btn";
    if (el.id === currentElement) button.classList.add("active");
    const preview = document.createElement("span");
    preview.className = "color-preview";
    preview.style.backgroundColor = `rgb(${el.color[0]}, ${el.color[1]}, ${el.color[2]})`;
    const text = document.createElement("span");
    text.textContent = el.name;
    button.appendChild(preview);
    button.appendChild(text);
    button.onclick = () => selectElement(el.id);
    uiGrid.appendChild(button);
  });
}
requestAnimationFrame(loop);
</script>
</body>
</html>
